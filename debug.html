<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NS2JB Debug Bridge</title>
<style>
:root {
  --bg: #0a0a0a; --fg: #e0e0e0; --accent: #4fc3f7; --err: #ef5350;
  --ok: #66bb6a; --card: #1a1a1a; --border: #333; --dim: #888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 14px/1.5 monospace; background: var(--bg); color: var(--fg); padding: 16px; }
h1 { font-size: 18px; color: var(--accent); margin-bottom: 4px; }
.sub { color: var(--dim); margin-bottom: 12px; }
.status { padding: 8px 12px; border-radius: 6px; margin: 12px 0; font-weight: bold; }
.status.connected { background: #1b3a1b; color: var(--ok); border: 1px solid #2e5a2e; }
.status.disconnected { background: #3a1b1b; color: var(--err); border: 1px solid #5a2e2e; }
.status.idle { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
.setup { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin: 12px 0; }
.setup input { font: 14px/1.5 monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; width: 200px; }
.setup input:focus { border-color: var(--accent); outline: none; }
.setup button { font: 14px/1.5 monospace; background: var(--accent); color: #000; border: none; border-radius: 4px; padding: 6px 16px; cursor: pointer; margin-left: 8px; }
.setup button:active { opacity: 0.8; }
#caps { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 12px 0; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 50vh; overflow-y: auto; }
#log { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 12px 0; font-size: 12px; max-height: 30vh; overflow-y: auto; }
.log-entry { border-bottom: 1px solid var(--border); padding: 4px 0; }
.log-entry:last-child { border-bottom: none; }
.log-err { color: var(--err); }
.log-ok { color: var(--ok); }
label { display: block; color: var(--dim); font-size: 12px; margin-top: 8px; }
noscript { display: block; background: #3a1b1b; color: var(--err); padding: 12px; border-radius: 6px; margin: 12px 0; }
.steps { color: var(--dim); font-size: 12px; margin: 12px 0; line-height: 1.8; }
.steps code { background: var(--card); padding: 2px 6px; border-radius: 3px; color: var(--fg); }
.hidden { display: none; }
</style>
</head>
<body>
<h1>NS2JB Debug Bridge</h1>
<p class="sub">LAN debug — not an exploit or native payload loader</p>

<noscript>
<p><strong>JavaScript is disabled.</strong></p>
<p>Record manually: firmware version, URL bar contents, this text visible, timestamp.</p>
</noscript>

<div id="setupBox" class="setup">
  <p>Connect to your debug server on the local network.</p>
  <div class="steps">
    On your computer, run: <code>node scripts/debug-server.cjs</code><br>
    Enter the IP and port it shows, then tap Connect.
  </div>
  <div style="margin-top:12px">
    <input id="hostInput" type="text" placeholder="192.168.1.x:8080" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="connectBtn" type="button">Connect</button>
  </div>
</div>

<div id="statusBox" class="status idle">Not connected</div>

<label>Connection</label>
<div id="log"></div>

<label>Browser Capabilities</label>
<div id="caps">Gathering...</div>

<script>
(function() {
  var setupBox = document.getElementById('setupBox');
  var hostInput = document.getElementById('hostInput');
  var connectBtn = document.getElementById('connectBtn');
  var statusBox = document.getElementById('statusBox');
  var capsBox = document.getElementById('caps');
  var logBox = document.getElementById('log');
  var pollTimer = null;
  var baseUrl = '';
  var startTime = Date.now();
  var seenCmd = 0;

  // If served directly by the debug server, auto-connect
  var isLocal = location.hostname !== 'localhost' &&
    !location.hostname.match(/github\.io$/) &&
    location.port !== '';
  if (isLocal) {
    baseUrl = location.protocol + '//' + location.host;
    setupBox.className = 'setup hidden';
    beginPolling();
  }

  try {
    var saved = localStorage.getItem('debug-host');
    if (saved && !isLocal) hostInput.value = saved;
  } catch(e) {}

  connectBtn.addEventListener('click', function() {
    var host = hostInput.value.trim();
    if (!host) return;
    if (host.indexOf(':') === -1) host += ':8080';
    if (host.indexOf('http') !== 0) host = 'http://' + host;
    baseUrl = host;
    try { localStorage.setItem('debug-host', hostInput.value.trim()); } catch(e) {}
    beginPolling();
  });

  hostInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') connectBtn.click();
  });

  function appendLog(msg, cls) {
    var el = document.createElement('div');
    el.className = 'log-entry' + (cls ? ' ' + cls : '');
    el.textContent = '[' + elapsed() + '] ' + msg;
    logBox.appendChild(el);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function elapsed() {
    var s = Math.floor((Date.now() - startTime) / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function gatherCapabilities() {
    var caps = {};
    caps.userAgent = navigator.userAgent || 'N/A';
    caps.platform = navigator.platform || 'N/A';
    caps.language = navigator.language || 'N/A';
    caps.cookieEnabled = navigator.cookieEnabled;
    caps.onLine = navigator.onLine;
    caps.hardwareConcurrency = navigator.hardwareConcurrency || 'N/A';
    caps.deviceMemory = navigator.deviceMemory || 'N/A';
    caps.maxTouchPoints = navigator.maxTouchPoints || 0;
    caps.screenWidth = screen.width;
    caps.screenHeight = screen.height;
    caps.screenColorDepth = screen.colorDepth;
    caps.devicePixelRatio = window.devicePixelRatio || 1;
    caps.innerWidth = window.innerWidth;
    caps.innerHeight = window.innerHeight;
    try { caps.es6Proxy = typeof Proxy !== 'undefined'; } catch(e) { caps.es6Proxy = false; }
    try { caps.es6Symbol = typeof Symbol !== 'undefined'; } catch(e) { caps.es6Symbol = false; }
    try { caps.bigInt = typeof BigInt !== 'undefined'; } catch(e) { caps.bigInt = false; }
    try { caps.weakRef = typeof WeakRef !== 'undefined'; } catch(e) { caps.weakRef = false; }
    try { caps.sharedArrayBuffer = typeof SharedArrayBuffer !== 'undefined'; } catch(e) { caps.sharedArrayBuffer = false; }
    try { caps.atomics = typeof Atomics !== 'undefined'; } catch(e) { caps.atomics = false; }
    try { caps.webAssembly = typeof WebAssembly !== 'undefined'; } catch(e) { caps.webAssembly = false; }
    try { caps.structuredClone = typeof structuredClone === 'function'; } catch(e) { caps.structuredClone = false; }
    try {
      var ab = new ArrayBuffer(8);
      var dv = new DataView(ab);
      dv.setFloat64(0, Math.PI);
      caps.dataView = dv.getFloat64(0) === Math.PI;
    } catch(e) { caps.dataView = false; }
    try { caps.float64Array = typeof Float64Array !== 'undefined'; } catch(e) { caps.float64Array = false; }
    try { caps.bigInt64Array = typeof BigInt64Array !== 'undefined'; } catch(e) { caps.bigInt64Array = false; }
    try { caps.webWorkers = typeof Worker !== 'undefined'; } catch(e) { caps.webWorkers = false; }
    try { caps.serviceWorker = 'serviceWorker' in navigator; } catch(e) { caps.serviceWorker = false; }
    try { caps.webGL = !!document.createElement('canvas').getContext('webgl2'); } catch(e) { caps.webGL = false; }
    try { caps.webGPU = typeof navigator.gpu !== 'undefined'; } catch(e) { caps.webGPU = false; }
    try { caps.fetch = typeof fetch === 'function'; } catch(e) { caps.fetch = false; }
    try { caps.indexedDB = typeof indexedDB !== 'undefined'; } catch(e) { caps.indexedDB = false; }
    try { caps.localStorage = typeof localStorage !== 'undefined'; } catch(e) { caps.localStorage = false; }
    try { caps.crypto = typeof crypto !== 'undefined' && typeof crypto.subtle !== 'undefined'; } catch(e) { caps.crypto = false; }
    try { caps.performance = typeof performance !== 'undefined' && typeof performance.now === 'function'; } catch(e) { caps.performance = false; }
    if (caps.performance) {
      try {
        var t1 = performance.now(), t2 = performance.now();
        var tries = 0;
        while (t2 === t1 && tries < 1000) { t2 = performance.now(); tries++; }
        caps.timerResolution = tries < 1000 ? (t2 - t1).toFixed(6) + 'ms' : '>1ms (clamped)';
      } catch(e) { caps.timerResolution = 'error'; }
    }
    try { caps.transferable = new ArrayBuffer(8).byteLength === 8; } catch(e) { caps.transferable = false; }
    try { caps.finalizationRegistry = typeof FinalizationRegistry !== 'undefined'; } catch(e) { caps.finalizationRegistry = false; }
    try {
      var jitTest = function() { var s = 0; for (var i = 0; i < 10000; i++) s += i; return s; };
      var t0 = Date.now();
      for (var r = 0; r < 100; r++) jitTest();
      caps.jitWarmupMs = Date.now() - t0;
    } catch(e) { caps.jitWarmupMs = 'error'; }
    // XHR availability (fallback if fetch missing)
    try { caps.xhr = typeof XMLHttpRequest !== 'undefined'; } catch(e) { caps.xhr = false; }
    return caps;
  }

  function formatCaps(caps) {
    var lines = [];
    var sections = {
      'Identity': ['userAgent', 'platform', 'language', 'cookieEnabled', 'onLine'],
      'Hardware': ['hardwareConcurrency', 'deviceMemory', 'maxTouchPoints'],
      'Screen': ['screenWidth', 'screenHeight', 'screenColorDepth', 'devicePixelRatio', 'innerWidth', 'innerHeight'],
      'JS Engine': ['es6Proxy', 'es6Symbol', 'bigInt', 'weakRef', 'sharedArrayBuffer', 'atomics', 'webAssembly', 'structuredClone'],
      'Typed Arrays': ['dataView', 'float64Array', 'bigInt64Array', 'transferable'],
      'Web APIs': ['xhr', 'fetch', 'webWorkers', 'serviceWorker', 'webGL', 'webGPU', 'indexedDB', 'localStorage', 'crypto', 'performance'],
      'Timing/GC': ['timerResolution', 'finalizationRegistry', 'jitWarmupMs']
    };
    for (var section in sections) {
      lines.push('── ' + section + ' ──');
      for (var i = 0; i < sections[section].length; i++) {
        var key = sections[section][i];
        var val = caps[key];
        if (val === undefined) val = 'N/A';
        var display = typeof val === 'boolean' ? (val ? '✓' : '✗') : String(val);
        lines.push('  ' + key + ': ' + display);
      }
      lines.push('');
    }
    return lines.join('\n');
  }

  // Show caps immediately
  capsBox.textContent = formatCaps(gatherCapabilities());

  // HTTP transport — works on any browser with XHR or fetch
  function post(path, body, cb) {
    if (typeof fetch === 'function') {
      fetch(baseUrl + path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      }).then(function(r) { return r.json(); }).then(cb).catch(function(e) { cb({error: e.message}); });
    } else if (typeof XMLHttpRequest !== 'undefined') {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', baseUrl + path, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({error: e.message}); } };
      xhr.onerror = function() { cb({error: 'network error'}); };
      xhr.send(JSON.stringify(body));
    } else {
      cb({error: 'no http transport'});
    }
  }

  function get(path, cb) {
    if (typeof fetch === 'function') {
      fetch(baseUrl + path).then(function(r) { return r.json(); }).then(cb).catch(function(e) { cb({error: e.message}); });
    } else if (typeof XMLHttpRequest !== 'undefined') {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', baseUrl + path, true);
      xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({error: e.message}); } };
      xhr.onerror = function() { cb({error: 'network error'}); };
      xhr.send();
    } else {
      cb({error: 'no http transport'});
    }
  }

  function beginPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    appendLog('Connecting to ' + baseUrl);

    var caps = gatherCapabilities();
    post('/api/capabilities', caps, function(res) {
      if (res.error) {
        statusBox.className = 'status disconnected';
        statusBox.textContent = 'Failed: ' + res.error;
        appendLog('Connection failed: ' + res.error, 'log-err');
        return;
      }
      statusBox.className = 'status connected';
      statusBox.textContent = 'Connected to host';
      appendLog('Connected — sent capabilities', 'log-ok');
      seenCmd = res.cmdId || 0;
      pollTimer = setInterval(poll, 1500);
    });
  }

  function poll() {
    get('/api/poll?after=' + seenCmd, function(res) {
      if (res.error) {
        statusBox.className = 'status disconnected';
        statusBox.textContent = 'Poll failed — retrying';
        return;
      }
      statusBox.className = 'status connected';
      statusBox.textContent = 'Connected to host';
      if (!res.commands || !res.commands.length) return;

      for (var i = 0; i < res.commands.length; i++) {
        var cmd = res.commands[i];
        seenCmd = cmd.id;
        if (cmd.type === 'eval') {
          appendLog('Eval: ' + cmd.code);
          try {
            var result = (0, eval)(cmd.code);
            var str = String(result);
            if (typeof result === 'object' && result !== null) {
              try { str = JSON.stringify(result, null, 2); } catch(e) { str = String(result); }
            }
            post('/api/result', {cmdId: cmd.id, result: str, error: false}, function(){});
            appendLog('=> ' + str, 'log-ok');
          } catch(e) {
            post('/api/result', {cmdId: cmd.id, result: e.message, error: true}, function(){});
            appendLog('=> Error: ' + e.message, 'log-err');
          }
        } else if (cmd.type === 'request-caps') {
          var caps = gatherCapabilities();
          capsBox.textContent = formatCaps(caps);
          post('/api/capabilities', caps, function(){});
          appendLog('Refreshed capabilities', 'log-ok');
        }
      }
    });
  }
})();
</script>
</body>
</html>
