name: Upstream Verification

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run upstream check
        run: |
          chmod +x scripts/check-upstream.sh
          scripts/check-upstream.sh

      - name: Validate targets config
        run: |
          jq empty config/targets.json
          echo "targets.json is valid JSON"

      - name: Validate results schema
        run: |
          jq empty results/schema.json
          echo "schema.json is valid JSON"

  summarize:
    runs-on: ubuntu-latest
    needs: check-upstream
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Summarize any existing results
        run: |
          chmod +x scripts/summarize-results
          scripts/summarize-results || true
