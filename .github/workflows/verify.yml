name: Upstream Verification & Tests

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run upstream check
        run: |
          chmod +x scripts/check-upstream.sh
          scripts/check-upstream.sh

      - name: Validate targets config
        run: jq empty config/targets.json

      - name: Validate results schema
        run: jq empty results/schema.json

  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run compatibility tests
        run: |
          npm ci --ignore-scripts
          npm test
          chmod +x tests/run-all.sh
          tests/run-all.sh
          node scripts/validate-results.cjs results/js-features-*.json results/runtime-errors-*.json results/isolation-*.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node${{ matrix.node-version }}
          path: results/*.json
          retention-days: 30

  browser-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: node scripts/validate-browser-entry.cjs results/entry-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-browser-evidence
          path: |
            results/browser-*.json
            results/entry-*.json
          retention-days: 30

  build-verify:
    runs-on: ubuntu-latest
    needs: check-upstream
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Verify upstream
        run: |
          bash scripts/install-zig.sh "$RUNNER_TEMP/zig-0.15.2"
          export PATH="$RUNNER_TEMP/zig-0.15.2:$PATH"
          export REQUIRE_REBUILD=1
          chmod +x scripts/verify-upstream.sh
          scripts/verify-upstream.sh
          REVISION=$(jq -er '.targets[] | select(.id == "ns2jb-smilebasic") | .upstream.last_known_commit' config/targets.json)
          git init -q "$RUNNER_TEMP/native-review-upstream"
          git -C "$RUNNER_TEMP/native-review-upstream" fetch -q --depth=1 https://gitlab.com/pepsipu/ns2jb.git "$REVISION"
          git -C "$RUNNER_TEMP/native-review-upstream" checkout -q --detach FETCH_HEAD
          node scripts/review-native.cjs "$RUNNER_TEMP/native-review-upstream" results/native-review.json "$RUNNER_TEMP/zig-0.15.2/zig"
          node scripts/native-coverage.cjs "$RUNNER_TEMP/native-review-upstream" results/native-coverage.json
          node scripts/review-native-assets.cjs "$RUNNER_TEMP/native-review-upstream" results/native-assets.json
          npm ci --ignore-scripts
          node scripts/validate-results.cjs results/native-review.json

      - name: Upload build verification results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-verify-results
          path: |
            results/build-verify-*.json
            results/native-review.json
            results/native-coverage.json
            results/native-assets.json
          retention-days: 30

  release-check:
    runs-on: ubuntu-latest
    needs: [check-upstream, test-suite, browser-suite, build-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/package-release.cjs dist/first
          node scripts/package-release.cjs dist/second
          diff -r dist/first dist/second
          cd dist/first
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-source-release
          path: dist/first/*
          retention-days: 30
